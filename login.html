<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AkumaTech</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BARRA DE NAVEGACION -->
    <nav>

        <a href="index.html">
            <img src="img/akuma_logo.png" alt="Logo AkumaTech" class="logo" width="100">
        </a>

        <ul>

            <li>
                <a href="index.html"><strong>Inicio</strong>
                </a>
            
            </li>

            <li>
                <a href="index.html#productos"><strong>Productos</strong>
                </a>
            </li>

            <li>
                <a href="carrito.html">🛒 <strong>Carrito</strong>
                    <span id="cantidad-carrito">0</span>
                </a>
            </li>

        </ul>

    </nav>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <section class="login">

            <h1>Iniciar Sesión</h1>

            <form id="login-form">

                <!-- CORREO -->
                <label for="correo">Correo:</label>

                <input type="email" id="correo" name="correo" maxlength="100" required placeholder="Ingresa tu correo">


                <!-- MENSAJE ERROR CORREO -->
                <p id="error-correo" class="mensaje-error"></p>


                <!-- CONTRASEÑA -->
                <label for="password">Contraseña:</label>

                <input type="password" id="password"name="password" minlength="4" maxlength="10" required placeholder="Ingresa tu contraseña">


                <!-- MENSAJE ERROR CONTRASEÑA -->
                <p id="error-password" class="mensaje-error"></p>


                <!-- BOTON -->
                <button type="submit"><strong>Iniciar Sesión</strong></button>

            </form>

        </section>

    </main>


    <footer>

        <p>Contáctanos: info@akumatech.com</p>

        <small>© 2026 AkumaTech - Tienda de Tecnología</small>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="body.js"></script>
    <script src="login.js"></script>

</body>

</html>
